# Infrastructure Management Script Configuration
# This file controls where different resource types are created

# Directory structure configuration
directories:
  # Base paths for different resource types
  environments: "envs"
  projects: "projects"
  modules: "modules"
  
  # Environment-specific directory structure
  environment_structure:
    # Where to place regional resources within an environment
    # Options: "direct" (env/region) or "project_based" (env/project/region)
    regional_placement: "project_based"
    
    # If using project_based, specify the default project name
    default_project: "h2g2"

# Template configuration
templates:
  # Base directory for templates
  base_path: "admin/templates"
  
  # Template subdirectories for each resource type
  environment: "env"
  region: "region"
  zone: "zone"
  project: "project"

# File naming configuration
files:
  # Configuration files for each resource type
  environment: "env.hcl"
  region: "region.hcl"
  project: "project.hcl"
  
  # Terragrunt configuration files
  terragrunt: "terragrunt.hcl"

# Validation rules
validation:
  # Required files for each resource type to be considered valid
  environment_required_files: ["env.hcl"]
  region_required_files: ["region.hcl"]
  zone_required_files: ["terragrunt.hcl"]
  project_required_files: ["project.hcl"]

# Naming conventions
naming:
  # Default naming patterns for resources
  environment_pattern: "{name}"
  region_pattern: "{name}"
  zone_pattern: "{name}"
  project_pattern: "{name}"

# Zone configuration
zones:
  allowed:
    # US East (N. Virginia) - us-east-1
    "us-east-1a": "use1a"
    "us-east-1b": "use1b" 
    "us-east-1c": "use1c"
    "us-east-1d": "use1d"
    "us-east-1e": "use1e"
    "us-east-1f": "use1f"
    
    # US East (Ohio) - us-east-2
    "us-east-2a": "use2a"
    "us-east-2b": "use2b"
    "us-east-2c": "use2c"
    
    # US West (Oregon) - us-west-2
    "us-west-2a": "usw2a"
    "us-west-2b": "usw2b"
    "us-west-2c": "usw2c"
    "us-west-2d": "usw2d"
    
    # US West (N. California) - us-west-1
    "us-west-1a": "usw1a"
    "us-west-1b": "usw1b"
    "us-west-1c": "usw1c"
    
    # Europe (Ireland) - eu-west-1
    "eu-west-1a": "euw1a"
    "eu-west-1b": "euw1b"
    "eu-west-1c": "euw1c"
    
    # Europe (London) - eu-west-2
    "eu-west-2a": "euw2a"
    "eu-west-2b": "euw2b"
    "eu-west-2c": "euw2c"
    
    # Europe (Paris) - eu-west-3
    "eu-west-3a": "euw3a"
    "eu-west-3b": "euw3b"
    "eu-west-3c": "euw3c"
    
    # Europe (Frankfurt) - eu-central-1
    "eu-central-1a": "euc1a"
    "eu-central-1b": "euc1b"
    "eu-central-1c": "euc1c"
    
    # Asia Pacific (Tokyo) - ap-northeast-1
    "ap-northeast-1a": "apne1a"
    "ap-northeast-1b": "apne1b"
    "ap-northeast-1c": "apne1c"
    "ap-northeast-1d": "apne1d"
    
    # Asia Pacific (Singapore) - ap-southeast-1
    "ap-southeast-1a": "apse1a"
    "ap-southeast-1b": "apse1b"
    "ap-southeast-1c": "apse1c"

# System-specific overrides
# You can create different config files for different systems
# and override specific settings as needed
overrides:
  # Example: Different structure for a different organization
  # alternative_structure:
  #   environments: "environments"
  #   projects: "applications"
  #   environment_structure:
  #     regional_placement: "project_based"
  #     default_project: "main"
